name: RunFiles - MosDNS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Get latest release tag
        id: get_tag
        run: |
          LATEST_TAG=$(curl -sL "https://api.github.com/repos/sbwml/luci-app-mosdns/releases/latest" | jq -r '.tag_name')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Download mosdns ipks
        run: |
          chmod +x runfilesbuilder/shell/mosdns.sh
          ./runfilesbuilder/shell/mosdns.sh
        env:
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}

      - name: Copy install.sh to each platform dir
        run: |
          chmod +x runfilesbuilder/shell/install.sh
          cp runfilesbuilder/shell/install.sh x86_64/install.sh
          cp runfilesbuilder/shell/install.sh aarch64_cortex-a53/install.sh
          cp runfilesbuilder/shell/install.sh arm_cortex-a7_neon-vfpv4/install.sh

      - name: Pack with makeself
        run: |
          mkdir -p output

          for PLATFORM in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            makeself "$PLATFORM" "output/luci-app-mosdns-${LATEST_TAG}_${PLATFORM}.run" \
              "MosDNS ${PLATFORM} Installer ${LATEST_TAG}" ./install.sh
          done

      - name: Upload run files to release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "${{ env.LATEST_TAG }}"
          name: "MosDNS-${{ env.LATEST_TAG }}"
          body_path: runfilesbuilder/common.md
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
