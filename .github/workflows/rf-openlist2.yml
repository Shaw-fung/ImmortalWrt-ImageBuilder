name: RunFiles - OpenList2

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Get latest release tag
        id: get_tag
        run: |
          LATEST_TAG=$(curl -sL "https://api.github.com/repos/sbwml/luci-app-openlist2/releases/latest" | jq -r '.tag_name')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Download and extract openlist2 ipks
        run: |
          set -e

          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          OUT_DIR=$(pwd)
          TMP_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$TMP_DIR"; }
          trap cleanup EXIT

          for platform in "${PLATFORMS[@]}"; do
            SAVE_DIR="${OUT_DIR}/${platform}"
            mkdir -p "$SAVE_DIR"

            echo "📦 正在处理平台: $platform"

            PKG_NAME="openwrt-24.10-${platform}.tar.gz"
            DOWNLOAD_URL="https://github.com/sbwml/luci-app-openlist2/releases/download/${LATEST_TAG}/${PKG_NAME}"

            echo "⬇️  正在下载: $PKG_NAME"
            curl -fsL -o "${TMP_DIR}/${PKG_NAME}" "$DOWNLOAD_URL"

            echo "📤 解压文件..."
            tar -xzf "${TMP_DIR}/${PKG_NAME}" -C "${TMP_DIR}"

            echo "📋 复制 packages_ci 目录内容..."
            if [ -d "${TMP_DIR}/packages_ci" ]; then
              cp -r "${TMP_DIR}/packages_ci"/* "$SAVE_DIR/"
            else
              echo "⚠️  未找到 packages_ci 目录，尝试直接复制 ipk 文件"
              find "${TMP_DIR}" -name "*.ipk" -type f -exec cp {} "$SAVE_DIR/" \;
            fi

            echo "🔧 处理文件名（去掉 ~）..."
            find "$SAVE_DIR" -name "*~*.ipk" -type f | while read -r file; do
              newfile="${file//\~/}"
              mv "$file" "$newfile"
              echo "  重命名: $(basename "$file") -> $(basename "$newfile")"
            done

            echo "✅ 平台 $platform 处理完成"
          done

          echo "✅ 所有平台下载处理完成"

      - name: Create install.sh for each platform
        run: |
          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          for platform in "${PLATFORMS[@]}"; do
            printf '#!/bin/sh\nopkg update\nopkg install *.ipk\n' > "${platform}/install.sh"
            chmod +x "${platform}/install.sh"
          done

      - name: Pack with makeself
        run: |
          mkdir -p output

          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            makeself "$PLATFORM" "output/openlist2_${PLATFORM}.run" \
              "OpenList2 ${PLATFORM} Installer" ./install.sh
          done

      - name: Upload run files to release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "openlist2"
          name: "OpenList2"
          body: "OpenList2 自动打包发布，包含 x86_64、aarch64_cortex-a53、arm_cortex-a7_neon-vfpv4 三个架构的安装包。"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
