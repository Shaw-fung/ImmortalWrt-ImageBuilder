name: RunFiles - PassWall

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Get latest PassWall release tag
        id: get_release
        run: |
          TAG=$(curl -fsL "https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest" | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest PassWall release: $TAG"

      - name: Download passwall ipks
        run: |
          set -e

          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          DEP_PREFIXES=(
            "xray-core"
            "v2ray-core"
            "sing-box"
            "dns2socks"
            "dns2tcp"
            "microsocks"
            "ipt2socks"
            "pdnsd-alt"
            "chinadns-ng"
            "shadowsocks-rust"
            "shadowsocksr-libev"
            "simple-obfs"
            "tcping"
            "trojan"
            "hysteria"
            "naiveproxy"
            "shadow-tls"
            "v2ray-plugin"
            "tuic-client"
            "redsocks2"
          )

          LUCI_PREFIXES=(
            "luci-app-passwall"
            "luci-i18n-passwall-zh-cn"
          )

          OUT_DIR=$(pwd)
          TMP_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$TMP_DIR"; }
          trap cleanup EXIT

          for platform in "${PLATFORMS[@]}"; do
            SAVE_DIR="${OUT_DIR}/${platform}"
            mkdir -p "${SAVE_DIR}/depends"
            mkdir -p "${SAVE_DIR}/main"

            echo "📦 正在处理平台: $platform"

            BASE_URL="https://dl.openwrt.ai/packages-24.10/${platform}/kiddin9"
            PKG_INDEX="${TMP_DIR}/${platform}_Packages"

            echo "🔍 从 ${BASE_URL}/Packages.gz 下载包索引"
            if ! curl -fsL "${BASE_URL}/Packages.gz" | gunzip -c > "$PKG_INDEX"; then
              echo "⚠️ 无法获取 ${BASE_URL}/Packages.gz"
              continue
            fi

            echo "📥 下载依赖包..."
            for prefix in "${DEP_PREFIXES[@]}"; do
              FILE=$(awk -v kw="$prefix" '
                $1=="Filename:" && $2 ~ "^"kw"_.*\\.ipk$" {
                  print $2; exit
                }
              ' "$PKG_INDEX")

              if [ -n "$FILE" ]; then
                if [[ "$FILE" == luci-app-* ]]; then
                  if [[ "$FILE" != luci-app-passwall* ]]; then
                    echo "⏭️  跳过非 passwall 的 luci-app 包: $FILE"
                    continue
                  fi
                fi
                echo "⬇️  正在下载: $FILE"
                curl -fsL -o "${SAVE_DIR}/depends/${FILE##*/}" "${BASE_URL}/${FILE}"
              else
                echo "❌ 未找到匹配: $prefix"
              fi
            done
          done

          echo "📥 从 GitHub Releases 下载 luci 包..."
          RELEASE_TAG="${{ steps.get_release.outputs.tag }}"
          ASSETS_URL="https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/tags/${RELEASE_TAG}"

          for prefix in "${LUCI_PREFIXES[@]}"; do
            FILE=$(curl -fsL "$ASSETS_URL" | jq -r ".assets[] | select(.name | startswith(\"${prefix}_\")) | .name" | head -n 1)
            if [ -n "$FILE" ]; then
              echo "⬇️  正在下载 luci 包: $FILE"
              DOWNLOAD_URL="https://github.com/Openwrt-Passwall/openwrt-passwall/releases/download/${RELEASE_TAG}/${FILE}"
              for platform in "${PLATFORMS[@]}"; do
                curl -fsL -o "${OUT_DIR}/${platform}/main/${FILE}" "$DOWNLOAD_URL"
              done
            else
              echo "❌ 未找到 luci 包: $prefix"
            fi
          done

          echo "✅ 下载完成"

      - name: Create install.sh for each platform
        run: |
          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          for platform in "${PLATFORMS[@]}"; do
            printf '#!/bin/sh\nopkg update\nopkg install depends/*.ipk\nopkg install main/*.ipk\n' > "${platform}/install.sh"
            chmod +x "${platform}/install.sh"
          done

      - name: Pack with makeself
        id: pack
        run: |
          mkdir -p output

          VERSION="${{ steps.get_release.outputs.tag }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            makeself "$PLATFORM" "output/luci-app-passwall-${VERSION}_${PLATFORM}.run" \
              "passwall ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: Upload run files to release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "passwall-${{ steps.pack.outputs.version }}"
          name: "passwall-${{ steps.pack.outputs.version }}"
          body_path: runfilesbuilder/info/passwall.md
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
