name: RunFiles - DAE

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: Download dae ipks
        run: |
          chmod +x runfilesbuilder/shell/dae.sh
          ./runfilesbuilder/shell/dae.sh

      - name: Copy install.sh to each platform dir
        run: |
          chmod +x runfilesbuilder/shell/install.sh
          cp runfilesbuilder/shell/install.sh x86_64/install.sh
          cp runfilesbuilder/shell/install.sh aarch64_generic/install.sh
          cp runfilesbuilder/shell/install.sh aarch64_cortex-a53/install.sh
          cp runfilesbuilder/shell/install.sh arm_cortex-a7_neon-vfpv4/install.sh

      - name: Extract version and pack
        id: pack
        run: |
          mkdir -p output

          APP_IPK=$(ls aarch64_generic/luci-app-dae_*.ipk | head -n 1)
          VERSION=$(basename "$APP_IPK" | sed -n 's/^luci-app-dae_\(.*\)_all\.ipk$/\1/p')

          if [ -z "$VERSION" ]; then
            echo "Cannot extract version"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            makeself "$PLATFORM" "output/luci-app-dae-${VERSION}_${PLATFORM}.run" \
              "dae ${PLATFORM} Installer v${VERSION}" ./install.sh
          done

      - name: Clean version name
        id: clean_version
        run: |
            version="${{ steps.pack.outputs.version }}"
            version=${version%%~*}
            echo "VERSION_CLEAN=$version" >> $GITHUB_ENV
            echo "cleaned_version=$version" >> $GITHUB_OUTPUT

      - name: Upload run files to release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "dae-${{ steps.clean_version.outputs.cleaned_version }}"
          name: "dae-${{ steps.clean_version.outputs.cleaned_version }}"
          body_path: runfilesbuilder/info/dae.md
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
