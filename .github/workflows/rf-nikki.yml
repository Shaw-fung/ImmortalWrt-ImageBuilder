name: RunFiles - nikki

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Get latest release tag
        id: get_tag
        run: |
          LATEST_TAG=$(curl -sL "https://api.github.com/repos/nikkinikki-org/OpenWrt-nikki/releases/latest" | jq -r '.tag_name')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Download and extract nikki ipks
        run: |
          set -e

          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          OUT_DIR=$(pwd)
          TMP_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$TMP_DIR"; }
          trap cleanup EXIT

          for platform in "${PLATFORMS[@]}"; do
            SAVE_DIR="${OUT_DIR}/${platform}"
            mkdir -p "$SAVE_DIR"

            echo "📦 正在处理平台: $platform"

            PKG_NAME="nikki_${platform}-openwrt-24.10.tar.gz"
            DOWNLOAD_URL="https://github.com/nikkinikki-org/OpenWrt-nikki/releases/download/${LATEST_TAG}/${PKG_NAME}"

            echo "⬇️  正在下载: $PKG_NAME"
            curl -fsL -o "${TMP_DIR}/${PKG_NAME}" "$DOWNLOAD_URL"

            echo "📤 解压文件..."
            tar -xzf "${TMP_DIR}/${PKG_NAME}" -C "$SAVE_DIR"

            echo "🔧 处理文件名（去掉 ~）..."
            find "$SAVE_DIR" -name "*~*.ipk" -type f | while read -r file; do
              newfile="${file//\~/}"
              mv "$file" "$newfile"
              echo "  重命名: $(basename "$file") -> $(basename "$newfile")"
            done

            echo "✅ 平台 $platform 处理完成"
          done

          echo "✅ 所有平台下载处理完成"

      - name: Create install.sh for each platform
        run: |
          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          for platform in "${PLATFORMS[@]}"; do
            printf '#!/bin/sh\nopkg update\nopkg install *.ipk\n' > "${platform}/install.sh"
            chmod +x "${platform}/install.sh"
          done

      - name: Pack with makeself
        run: |
          mkdir -p output

          PLATFORMS=(
            "x86_64"
            "aarch64_cortex-a53"
            "arm_cortex-a7_neon-vfpv4"
          )

          LATEST_TAG="${{ env.LATEST_TAG }}"

          for PLATFORM in "${PLATFORMS[@]}"; do
            makeself "$PLATFORM" "output/nikki-${LATEST_TAG}_${PLATFORM}.run" \
              "nikki ${PLATFORM} Installer ${LATEST_TAG}" ./install.sh
          done

      - name: Upload run files to release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "${{ env.LATEST_TAG }}"
          name: "nikki-${{ env.LATEST_TAG }}"
          body_path: runfilesbuilder/info.md
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
