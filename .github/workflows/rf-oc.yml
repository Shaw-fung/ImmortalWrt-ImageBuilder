name: RunFiles - OpenClash

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Download OpenClash ipks and meta kernel
        run: |
          chmod +x runfilesbuilder/shell/oc.sh
          ./runfilesbuilder/shell/oc.sh

      - name: Copy install.sh to each platform dir
        run: |
          chmod +x runfilesbuilder/shell/install.sh
          cp runfilesbuilder/shell/install.sh openclash-x86/install.sh
          cp runfilesbuilder/shell/install.sh openclash-a53/install.sh
          cp runfilesbuilder/shell/install.sh openclash-arm/install.sh

      - name: Extract version and pack
        id: pack
        run: |
          mkdir -p output

          OC_IPK=$(ls openclash-x86/luci-app-openclash_*.ipk | head -n 1)
          VERSION=$(basename "$OC_IPK" | sed -n 's/^luci-app-openclash_\(.*\)_all\.ipk$/\1/p')

          if [ -z "$VERSION" ]; then
            echo "Cannot extract version"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          makeself openclash-x86 "output/luci-app-openclash-${VERSION}_x86_64.run" \
            "OpenClash x86_64 Installer v${VERSION}" ./install.sh

          makeself openclash-a53 "output/luci-app-openclash-${VERSION}_aarch64_cortex-a53.run" \
            "OpenClash aarch64_cortex-a53 Installer v${VERSION}" ./install.sh

          makeself openclash-arm "output/luci-app-openclash-${VERSION}_arm_cortex-a7_neon-vfpv4.run" \
            "OpenClash arm_cortex-a7_neon-vfpv4 Installer v${VERSION}" ./install.sh

      - name: Clean version name
        id: clean_version
        run: |
          version="${{ steps.pack.outputs.version }}"
          version=${version%%~*}
          echo "VERSION_CLEAN=$version" >> $GITHUB_ENV
          echo "cleaned_version=$version" >> $GITHUB_OUTPUT

      - name: Upload run files to release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "openclash-${{ steps.clean_version.outputs.cleaned_version }}"
          name: "OpenClash-${{ steps.clean_version.outputs.cleaned_version }}"
          body_path: runfilesbuilder/info/openclash.md
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
